# Запасной вариант для сред, где контейнеры в bridge-сети не видят друг друга
# (так было в нашей песочнице): docker compose -f docker-compose.yml -f docker-compose.hostnet.yml up -d
# В host-сети проброс портов не работает, поэтому Postgres слушает 5433 на хосте
# (5432 занят word-focus). Шлюз по-прежнему на 4000.
services:
  postgres:
    network_mode: host
    ports: !reset []
    command: ["postgres", "-c", "port=5433"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5433 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
  gateway:
    network_mode: host
    ports: !reset []
    environment:
      DB_URL: jdbc:postgresql://localhost:5433/gateway
