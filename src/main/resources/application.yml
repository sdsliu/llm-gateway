server:
  port: 4000

spring:
  application:
    name: llm-gateway
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gateway}
    username: ${DB_USER:gateway}
    password: ${DB_PASSWORD:gateway}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # схемой управляет Flyway (src/main/resources/db/migration)
  flyway:
    enabled: true
  mvc:
    async:
      request-timeout: -1   # SSE-соединения живут долго; таймаут задаёт сам SseEmitter

gateway:
  # Пауза для провайдера после 429/5xx/таймаута, если он не прислал Retry-After
  default-cooldown: 5m
  openrouter:
    name: openrouter        # какой провайдер из списка опрашивать через GET /key
    poll-interval: PT5M  # ISO-8601
  health:
    timeout: PT10S          # таймаут ping (GET {base-url}{ping-path}, по умолчанию /models)
    models-ttl: PT10M       # сколько кэшировать список моделей провайдера
    max-body-size: 16MB     # OpenRouter /models весит больше 1 МБ
    scheduled: false        # true — пинговать всех по расписанию
    interval: PT5M
  status:
    heartbeat: PT15S         # SSE heartbeat для дашборда
    state-check: PT1S       # как часто проверять смену состояния провайдеров
    emitter-timeout: 30m
  # Список провайдеров. priority: меньше = пробуем раньше.
  # Провайдеры с пустым api-key пропускаются при старте.
  # Ключи — только через переменные окружения, в репозиторий не коммитим.
  providers:
    - name: groq
      base-url: https://api.groq.com/openai/v1
      api-key: ${GROQ_API_KEY:}
      model: openai/gpt-oss-120b
      priority: 1
      timeout: 120s
      limits:
        rpm: 30
        rpd: 1000
    # Z.ai (Zhipu GLM): OpenAI-совместимый API, https://docs.z.ai/guides/overview/quick-start
    # glm-4.7-flash — бесплатная модель (https://docs.z.ai/guides/overview/pricing).
    # GET /models в документации Z.ai не описан: если он ответит 404/405, ping считает провайдера
    # доступным (сервер ответил), но без списка моделей. Путь можно сменить через ping-path.
    - name: zai
      base-url: https://api.z.ai/api/paas/v4
      api-key: ${ZAI_API_KEY:}
      model: glm-4.7-flash
      priority: 2
      timeout: 120s
    # meta-llama/llama-3.3-70b-instruct:free снят с OpenRouter (endpoints: []) -> 404 "No endpoints found".
    # Замена (проверено 2026-10-17 по GET https://openrouter.ai/api/v1/models и /models/{id}/endpoints):
    # nvidia/nemotron-3-super-120b-a12b:free, 262k контекст, tools. Запасной вариант — openrouter/free (роутер free-моделей).
    # Free-модели требуют разрешений в https://openrouter.ai/settings/privacy, иначе тоже 404 «No endpoints found».
    - name: openrouter
      base-url: https://openrouter.ai/api/v1
      api-key: ${OPENROUTER_API_KEY:}
      model: nvidia/nemotron-3-super-120b-a12b:free
      priority: 3
      timeout: 120s
      limits:
        rpm: 20
        rpd: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info
