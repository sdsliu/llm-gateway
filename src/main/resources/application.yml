server:
  port: 4000

spring:
  application:
    name: llm-gateway
  jackson:
    default-property-inclusion: non_null

gateway:
  # Пауза для провайдера после 429/5xx/таймаута, если он не прислал Retry-After
  default-cooldown: 5m
  # Список провайдеров. priority: меньше = пробуем раньше.
  # Провайдеры с пустым api-key пропускаются при старте.
  # Ключи — только через переменные окружения, в репозиторий не коммитим.
  providers:
    - name: groq
      base-url: https://api.groq.com/openai/v1
      api-key: ${GROQ_API_KEY:}
      model: openai/gpt-oss-120b
      priority: 1
      timeout: 120s
      limits:
        rpm: 30
        rpd: 1000
    - name: gemini
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      api-key: ${GEMINI_API_KEY:}
      model: gemini-2.5-flash
      priority: 2
      timeout: 120s
      limits:
        rpm: 10
        rpd: 250
    - name: openrouter
      base-url: https://openrouter.ai/api/v1
      api-key: ${OPENROUTER_API_KEY:}
      model: meta-llama/llama-3.3-70b-instruct:free
      priority: 3
      timeout: 120s
      limits:
        rpm: 20
        rpd: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info
