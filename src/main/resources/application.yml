server:
  port: 4000

spring:
  application:
    name: llm-gateway
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gateway}
    username: ${DB_USER:gateway}
    password: ${DB_PASSWORD:gateway}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # схемой управляет Flyway (src/main/resources/db/migration)
  flyway:
    enabled: true
  mvc:
    async:
      request-timeout: -1   # SSE-соединения живут долго; таймаут задаёт сам SseEmitter

gateway:
  # Пауза для провайдера после 429/5xx/таймаута, если он не прислал Retry-After
  default-cooldown: 5m
  # Режим выбора провайдера по умолчанию. С дашборда / PUT /status/routing меняется и сохраняется в БД
  # (таблица routing_settings) — переживает рестарт и имеет приоритет над этим блоком.
  # «Сбросить к настройкам из конфига» (DELETE /status/routing) удаляет сохранённое — снова действует этот блок.
  #   priority    — по priority; если задан primary, он идёт первым, остальные — по priority;
  #   round-robin — по кругу среди доступных сейчас (без cooldown/лимита), при ошибке — следующий;
  #   headroom    — к тому, у кого больше всего запаса по лимитам (RPM/RPD/TPM/сутки/месяц) под этот запрос.
  # Во всех режимах провайдер без места под запрос пропускается (см. gateway.limits ниже).
  routing:
    mode: headroom
    primary:               # имя провайдера из списка ниже; пусто — чистый приоритет
  # Маршрутизация по лимитам (issue #34). Лимиты провайдера узнаём у него самого (при старте и из заголовков
  # ответов); gateway.providers[].limits — только запасной вариант. Подробности — README, «Лимиты провайдеров».
  limits:
    startup-probe: true     # опросить провайдеров ДО приёма запросов; не ответивших — исключить из роутинга
    probe-timeout: PT10S    # таймаут опроса одного провайдера (старт не зависнет)
    reprobe-interval: PT1M  # как часто перепинговывать исключённых и поставленных на паузу после 429
    refresh-interval: PT30M # как часто обновлять лимиты из API (OpenRouter /key, Gonka /test-auth)
    max-wait: PT20S         # места нет ни у кого — ждать до этого времени, потом 429 rate_limit_exceeded
    default-max-tokens: 1024 # оценка выхода, если клиент не прислал max_tokens
    pin-model-per-run: false # true — все запросы с одним x-run-id идут к одному провайдеру, пока он доступен
    pin-ttl: PT12H
  openrouter:
    name: openrouter        # какой провайдер из списка опрашивать через GET /key
    poll-interval: PT5M  # ISO-8601
  health:
    timeout: PT10S          # таймаут ping (GET {base-url}{ping-path}, по умолчанию /models)
    models-ttl: PT10M       # сколько кэшировать список моделей провайдера
    max-body-size: 16MB     # OpenRouter /models весит больше 1 МБ
    scheduled: false        # true — пинговать всех по расписанию
    interval: PT5M
  status:
    heartbeat: PT15S         # SSE heartbeat для дашборда
    state-check: PT1S       # как часто проверять смену состояния провайдеров
    emitter-timeout: 30m
  # Список провайдеров. priority: меньше = пробуем раньше.
  # Провайдеры с пустым api-key пропускаются при старте — кроме api-key-optional: true (keyless-режим:
  # запросы уходят без заголовка Authorization; если ключ задан — он используется, лимиты выше).
  # Ключи — только через переменные окружения, в репозиторий не коммитим.
  providers:
    - name: groq
      base-url: https://api.groq.com/openai/v1
      api-key: ${GROQ_API_KEY:}
      model: openai/gpt-oss-120b
      priority: 1
      timeout: 120s
      # Fallback: при старте Groq сообщает реальные лимиты в x-ratelimit-* (limit-requests = RPD, limit-tokens = TPM).
      limits:
        rpm: 30
        rpd: 1000
        tpm: 8000
    # Z.ai (Zhipu GLM): OpenAI-совместимый API, https://docs.z.ai/guides/overview/quick-start
    # glm-4.7-flash — бесплатная модель (https://docs.z.ai/guides/overview/pricing).
    # GET /models в документации Z.ai не описан: если он ответит 404/405, ping считает провайдера
    # доступным (сервер ответил), но без списка моделей. Путь можно сменить через ping-path.
    - name: zai
      base-url: https://api.z.ai/api/paas/v4
      api-key: ${ZAI_API_KEY:}
      model: glm-4.7-flash
      priority: 2
      # У GLM-4.7 thinking включён по умолчанию и обязателен при enabled: 36-77 с и ~1600 completion-токенов
      # на простой запрос. Отключаем (https://docs.z.ai/guides/capabilities/thinking-mode,
      # https://docs.z.ai/api-reference/llm/chat-completion — ChatThinking.type: enabled|disabled).
      extra-body:
        thinking:
          type: disabled
      # Короткий таймаут: дольше 20 с ждать нет смысла — клиенты (path-code-ai) отвалятся раньше.
      # Таймаут = 504 -> cooldown (default-cooldown) и failover на openrouter.
      timeout: 20s
    # Kilo AI Gateway: OpenAI-совместимый, https://kilo.ai/docs/gateway (base URL https://ai-gateway.kilo.ai/api/v1).
    # Anonymous access (https://kilo.ai/docs/gateway/authentication): без ключа доступны только бесплатные модели,
    # лимит 200 запросов в час на IP. KILO_API_KEY необязателен (с ключом — по аккаунту Kilo).
    # nvidia/nemotron-3-super-120b-a12b:free (262k контекст, цена 0) — проверено 2026-10-17 без ключа:
    # GET /models — 200, POST /chat/completions — 200 стабильно (3-6 с). kilo-auto/free НЕ берём: он каждый раз
    # уводит запрос на случайную free-модель (dots-studio, reflection/beam, stealth/...), часть из них тратит
    # весь max_tokens на reasoning и отдаёт content: null, бывали 503 upstream_error.
    # Лимиты шлюза: 200/час ≈ 3.3/мин в среднем; rpm 10 — запас на всплески, rpd 4800 = 200 × 24.
    # Заголовков x-ratelimit-* Kilo не присылает: при 429 — cooldown (Retry-After или default-cooldown).
    - name: kilo
      base-url: https://ai-gateway.kilo.ai/api/v1
      api-key: ${KILO_API_KEY:}
      api-key-optional: true
      model: nvidia/nemotron-3-super-120b-a12b:free
      priority: 3
      timeout: 60s
      limits:
        rpm: 10
        rpd: 4800
    # OVHcloud AI Endpoints: OpenAI-совместимый, https://docs.ovhcloud.com/en/guides/public-cloud/ai-machine-learning/ai-endpoints-getting-started
    # Anonymous (без ключа): 2 запроса в минуту на IP и НА МОДЕЛЬ; с ключом (OVH_AI_API_KEY) — 400 в минуту
    # на Public Cloud проект и модель. Тогда поднимите лимит шлюза: OVH_AI_RPM=400.
    # gpt-oss-120b (131k контекст) — проверено 2026-10-17: GET /models и POST /chat/completions без ключа — 200.
    # OVH присылает ratelimit-remaining / ratelimit-reset (сек) — при remaining=0 шлюз сам ставит паузу до сброса.
    - name: ovh
      base-url: https://oai.endpoints.kepler.ai.cloud.ovh.net/v1
      api-key: ${OVH_AI_API_KEY:}
      api-key-optional: true
      model: gpt-oss-120b
      priority: 4
      timeout: 60s
      limits:
        rpm: ${OVH_AI_RPM:2}
    # Cloudflare Workers AI: OpenAI-совместимые эндпоинты
    # https://developers.cloudflare.com/workers-ai/configuration/open-ai-compatibility/
    # Нужны CLOUDFLARE_API_TOKEN (права Workers AI: Read/Edit) и CLOUDFLARE_ACCOUNT_ID; без токена — пропускается.
    # Free: 10 000 Neurons в сутки (https://developers.cloudflare.com/workers-ai/platform/pricing/), лимит
    # Text Generation — 300 запросов в минуту (https://developers.cloudflare.com/workers-ai/platform/limits/).
    # @cf/qwen/qwen3-30b-a3b-fp8 — одна из самых «дешёвых» сильных моделей: 4625 neurons / M input,
    # 30475 neurons / M output => ~2M входных или ~330k выходных токенов в сутки бесплатно
    # (для сравнения llama-3.3-70b-instruct-fp8-fast — ~49k выходных). Суточный лимит считается в нейронах,
    # поэтому rpd не задаём: исчерпание квоты = ошибка от Cloudflare -> cooldown и failover.
    # Списка моделей в OpenAI-формате нет: GET {base-url}/models отвечает 405 (маршруты /ai/v1/* — только POST),
    # а ping считает 404/405 «сервер ответил — доступен» (без списка моделей). Поэтому ping-path по умолчанию.
    # Без CLOUDFLARE_ACCOUNT_ID URL получится битым (/accounts//ai/v1) — задавайте обе переменные.
    - name: cloudflare
      base-url: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID:}/ai/v1
      api-key: ${CLOUDFLARE_API_TOKEN:}
      model: "@cf/qwen/qwen3-30b-a3b-fp8"
      priority: 5
      timeout: 60s
      limits:
        rpm: 300
    # meta-llama/llama-3.3-70b-instruct:free снят с OpenRouter (endpoints: []) -> 404 "No endpoints found".
    # Замена (проверено 2026-10-17 по GET https://openrouter.ai/api/v1/models и /models/{id}/endpoints):
    # nvidia/nemotron-3-super-120b-a12b:free, 262k контекст, tools. Запасные — в fallback-models ниже.
    # Free-модели требуют разрешений в https://openrouter.ai/settings/privacy, иначе тоже 404 «No endpoints found».
    - name: openrouter
      base-url: https://openrouter.ai/api/v1
      api-key: ${OPENROUTER_API_KEY:}
      model: nvidia/nemotron-3-super-120b-a12b:free
      # Нативные fallback-модели OpenRouter (поле "models" в теле): пробуются по порядку, если основная
      # недоступна/лимит. Проверено 2026-10-17: у всех трёх :free есть живые endpoints;
      # openrouter/free — роутер по всем бесплатным моделям, последний рубеж.
      fallback-models:
        - google/gemma-4-31b-it:free
        - poolside/laguna-s-2.1:free
        - openrouter/free
      priority: 6
      timeout: 120s
      limits:
        rpm: 20
        rpd: 50
    # SambaNova Cloud: OpenAI-совместимый API, Bearer-ключ, https://docs.sambanova.ai
    # Free Tier (без привязанной карты): 20 RPM / 20 RPD / 200K токенов в день НА МОДЕЛЬ
    # (https://docs.sambanova.ai/docs/en/models/rate-limits). gpt-oss-120b — production-модель,
    # проверено по GET https://api.sambanova.ai/v1/models 2026-10-17.
    # ВНИМАНИЕ: с 2026-08 SambaCloud требует карту даже для Free-плана — аккаунт без карты получает
    # 402 PAYMENT_METHOD_REQUIRED (проверено 2026-10-17 на всех моделях). 402 считается retriable:
    # cooldown + failover на следующего провайдера, так что без карты провайдер просто «пропускается».
    # Поэтому стоит последним (priority 7), пока к аккаунту не привязана карта.
    # Заголовки лимитов: x-ratelimit-*-requests (минута) и x-ratelimit-*-requests-day (сутки).
    - name: sambanova
      base-url: https://api.sambanova.ai/v1
      api-key: ${SAMBANOVA_API_KEY:}
      model: gpt-oss-120b
      priority: 7
      timeout: 120s
      limits:
        rpm: 20
        rpd: 20
        tokens-per-day: 200000
    # Gonka Broker (пример, выключен): лимиты берутся из GET /test-auth (maxRpm), квота ~1M токенов в месяц.
    # Если /test-auth лежит не под base-url — укажите полный адрес в limits-probe-url.
    # - name: gonka
    #   base-url: https://<broker>/v1
    #   api-key: ${GONKA_API_KEY:}
    #   model: <model>
    #   priority: 8
    #   limits-probe: gonka
    #   limits-probe-url: https://<broker>/test-auth
    #   limits:
    #     rpm: 6
    #     tokens-per-month: 1000000

  # Дашборд «Эффективность» (/efficiency.html, GET /stats/efficiency): откуда брать итоги прогонов ai-runner.
  # Необязательно: если spring-runner не запущен, страница покажет только данные шлюза. Пусто — не спрашивать.
  # В docker-compose с hostnet localhost — это хост, где на 8085 работает spring-runner.
  efficiency:
    runner-stats-url: ${RUNNER_STATS_URL:http://localhost:8085/stats}
  # Справочные цены ПЛАТНЫХ моделей за 1M токенов — только для ОЦЕНКИ «сколько бы это стоило».
  # Шлюз ходит к бесплатным провайдерам, реальных расходов нет. Цены меняются — сверяйте с прайсом провайдера
  # (значения ниже — примерные публичные цены этих моделей на 2025 год; проверьте актуальный прайс и поправьте).
  pricing:
    currency: USD
    note: "Оценка: сколько стоили бы эти токены на платной модели (справочные цены за 1M токенов, не реальный счёт)"
    models:
      - name: gpt-4o
        input-per-million: 2.50
        output-per-million: 10.00
      - name: claude-sonnet
        input-per-million: 3.00
        output-per-million: 15.00
      - name: gpt-4o-mini
        input-per-million: 0.15
        output-per-million: 0.60

management:
  endpoints:
    web:
      exposure:
        include: health,info
