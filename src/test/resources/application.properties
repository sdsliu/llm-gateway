# Тесты: H2 в режиме совместимости с PostgreSQL вместо настоящего Postgres.
spring.datasource.url=jdbc:h2:mem:gateway;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
gateway.status.state-check=PT1H
gateway.status.heartbeat=PT1H
# Тесты без сети: не опрашивать провайдеров при старте и по расписанию (issue #34) — все в роутинге, лимиты из конфига.
gateway.limits.startup-probe=false
